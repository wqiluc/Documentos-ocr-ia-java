spring.application.name=validacao-documentos
server.port=8080

# Banco padrão: H2 em memória (modo PostgreSQL) — sobe sem instalar nada.
# Para usar o PostgreSQL de verdade: mvn spring-boot:run -Dspring-boot.run.profiles=postgres
spring.datasource.url=jdbc:h2:mem:validacao_documentos;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Upload em base64 (até ~10 MB)
spring.servlet.multipart.max-file-size=10MB
server.tomcat.max-swallow-size=20MB
spring.codec.max-in-memory-size=20MB

# IA (OpenAI) — sem chave, usa o interpretador local (regex)
app.ai.openai.api-key=${OPENAI_API_KEY:}
app.ai.openai.model=${OPENAI_MODEL:gpt-4o-mini}
app.ai.openai.url=https://api.openai.com/v1/chat/completions

# Tesseract (OCR)
app.ocr.command=tesseract
app.ocr.tessdata-path=/opt/homebrew/share/tessdata
app.ocr.language=por

# OpenCV (script Python que recebe: arquivoEntrada arquivoSaida)
app.opencv.command=python3 scripts/pre-processar_documento.py

# Regras
app.regras.confianca-minima=60
app.regras.caracteres-minimos=40
app.regras.dias-maximos-emissao=90

app.cors.origens=http://localhost:5173
